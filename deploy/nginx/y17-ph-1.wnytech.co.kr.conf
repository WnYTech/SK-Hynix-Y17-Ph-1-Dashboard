# Proposed HTTPS hostname: add/update its Route 53 A record before using this site.
# Install on the nginx server at 192.168.100.116.
# The application serves its React build and /api on a single private port.
upstream y17_dashboard_servers {
    server 192.168.200.254:8017;
    keepalive 16;
}

server {
    listen 80;
    server_name y17-ph-1.wnytech.co.kr;
    return 301 https://y17-ph-1.wnytech.co.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name y17-ph-1.wnytech.co.kr;

    ssl_certificate /etc/letsencrypt/live/wnytech.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wnytech.co.kr/privkey.pem;

    access_log /var/log/nginx/y17-dashboard.access.log;
    error_log /var/log/nginx/y17-dashboard.error.log;

    location / {
        proxy_pass http://y17_dashboard_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
